<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アプリ</title>
    <!-- 書体（DESIGN.md 3 章）。読み込めないときは端末の書体で描く -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=M+PLUS+1p:wght@400;700&display=swap" />
  </head>
  <body>
    <!-- この端末で選んだテーマを最初の描画から当てる（読み込み中に色が切り替わって見えないように） -->
    <script>
      try {
        var r = document.documentElement.dataset, m = localStorage.getItem("ds.mode") || "light"
        r.skin = localStorage.getItem("ds.skin") || "red"
        r.modePref = m
        r.mode = m === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : m
        var a = JSON.parse(localStorage.getItem("ds.assist") || "{}") || {}
        if (a.text === "large" || a.text === "larger") r.text = a.text
        if (a.contrast === "more" || matchMedia("(prefers-contrast: more)").matches) r.contrast = "more"
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
