# カタログを GitHub Pages（https://ymasaki.github.io/ignite/）へ配信する。
# main は「プロダクションへ」の release.mjs が GitHub へ送るので、公開と同じ時点で更新される。
name: カタログを Pages へ配信

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: node_modules/.bin/vite build catalog --outDir "$PWD/catalog-dist" --emptyOutDir
        env:
          CATALOG_BASE: /ignite/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
